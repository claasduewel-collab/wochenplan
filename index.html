<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wochenplan</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Wochenplan">
<meta name="theme-color" content="#f6f4ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151714" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#f6f4ee; --card:#ffffff; --ink:#1d211c; --muted:#6c7166; --line:#e4e1d7;
  --accent:#2f6b3a; --accent-soft:#e3efe2; --deal:#c2410c; --deal-soft:#fdeee4;
  --warn:#9a6700; --warn-soft:#fbf1d6; --bad:#b42318; --bad-soft:#fde8e6;
  --radius:16px; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#151714; --card:#1f221e; --ink:#eceee8; --muted:#9aa094; --line:#30352e;
    --accent:#7fc48a; --accent-soft:#233326; --deal:#fb923c; --deal-soft:#3a2416;
    --warn:#e3b341; --warn-soft:#33290f; --bad:#f97066; --bad-soft:#3b1a17;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  padding:env(safe-area-inset-top) 0 calc(150px + env(safe-area-inset-bottom));}
button,input{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
header{padding:18px 0 6px}
h1{font-size:28px;line-height:1.15;margin:0;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
.banner{border-radius:12px;padding:12px 14px;margin:12px 0;font-size:14px}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.info{background:var(--accent-soft);color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin:12px 0}
.days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:10px 16px 4px}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:15px;cursor:pointer}
.day[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.day .today{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:middle}
.meal-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.slot{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.kcal-pill{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;background:var(--accent-soft);color:var(--accent);padding:3px 10px;border-radius:999px;white-space:nowrap}
.meal-name{font-size:19px;font-weight:650;margin:6px 0 2px;letter-spacing:-.01em}
.meal-name.nope{text-decoration:line-through;color:var(--muted)}
.macro-line{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;margin-bottom:10px}
.reuse{background:var(--accent-soft);color:var(--accent);font-size:13px;border-radius:10px;padding:7px 10px;margin:0 0 10px}
ul.ing{list-style:none;margin:0;padding:0}
ul.ing li{display:grid;grid-template-columns:1fr auto 36px;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:15px}
ul.ing li:first-child{border-top:0}
ul.ing li.nope .iname{text-decoration:line-through;color:var(--muted)}
.iname small{display:block;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.g{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--muted);text-align:right;font-size:14px}
.g b{color:var(--ink);font-weight:600;font-size:15px}
.nope-btn{width:36px;height:36px;border-radius:10px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.nope-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nope-btn[aria-pressed="true"]{background:var(--bad-soft);color:var(--bad)}
.meal-actions{display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:8px}
summary{cursor:pointer;color:var(--accent);font-size:14px;font-weight:600;padding:6px 0;list-style:none}
summary::-webkit-details-marker{display:none}
.link-btn{background:none;border:0;color:var(--muted);font-size:13px;font-weight:600;padding:6px 0;cursor:pointer}
.link-btn[aria-pressed="true"]{color:var(--bad)}
ol.steps{margin:6px 0 0;padding-left:20px;font-size:15px}
ol.steps li{margin:4px 0}
.day-total{display:flex;align-items:baseline;gap:8px;margin:2px 0 12px}
.day-total .big{font-size:30px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.totals{display:grid;gap:10px}
.bar-row{display:grid;grid-template-columns:72px 1fr auto;align-items:center;gap:10px;font-size:14px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar i.over{background:var(--warn)}
.num{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;white-space:nowrap}
.extras{font-size:13px;color:var(--muted);margin-top:10px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 0 8px;font-weight:650}
.sum{display:flex;justify-content:space-between;align-items:baseline}
.sum .big{font-size:30px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.shop{list-style:none;margin:0;padding:0}
.shop li{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
.shop li:first-child{border-top:0}
.shop input{appearance:none;-webkit-appearance:none;width:24px;height:24px;border:2px solid var(--line);border-radius:7px;flex:0 0 auto;margin:1px 0 0;display:grid;place-content:center;background:var(--card);cursor:pointer}
.shop input:checked{background:var(--accent);border-color:var(--accent)}
.shop input:checked::after{content:"";width:6px;height:11px;border:solid var(--card);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.shop .done .what{text-decoration:line-through;color:var(--muted)}
.what{flex:1;min-width:0}
.what small{display:block;color:var(--muted);font-size:13px}
.price{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:15px}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:1px}
.tag.deal{background:var(--deal-soft);color:var(--deal)}
.tag.used{background:var(--accent-soft);color:var(--accent)}
.offer{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.offer:first-child{border-top:0}
.muted{color:var(--muted)}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 12px;font-size:14px}
.chip button{border:0;background:transparent;width:24px;height:24px;border-radius:50%;cursor:pointer;color:var(--muted);font-size:16px;line-height:1}
.chip.new{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.add-row{display:flex;gap:8px;margin-top:10px}
.field{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 label{font-size:13px;color:var(--muted);display:grid;gap:4px}
.btn{display:inline-block;background:var(--ink);color:var(--bg);border:0;border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600;text-decoration:none;cursor:pointer;text-align:center}
.btn.accent{background:var(--accent);color:var(--card)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:15px}
.kv span:nth-child(even){font-variant-numeric:tabular-nums;color:var(--muted);text-align:right}
ol.how{padding-left:20px;margin:8px 0;font-size:14px}
ol.how li{margin:4px 0}
.dock{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));pointer-events:none}
.savebar{pointer-events:auto;background:var(--ink);color:var(--bg);border-radius:16px;padding:10px 10px 10px 14px;display:flex;align-items:center;gap:8px;margin-bottom:8px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.savebar .t{flex:1;font-size:14px;line-height:1.3}
.savebar .btn{background:var(--bg);color:var(--ink);padding:8px 11px;font-size:13px}
.savebar .btn.accent{background:var(--accent);color:#fff}
.status{pointer-events:auto;background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:9px 12px;font-size:14px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s 1s linear infinite;flex:0 0 auto}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
nav button{background:none;border:0;color:var(--muted);font-size:11px;font-weight:600;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="page"]{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Wochenplan</h1>
    <div class="sub" id="sub">Lade …</div>
  </header>
  <div id="banners"></div>
  <main id="view"></main>
</div>

<div class="dock"><div class="wrap" id="dock"></div></div>

<nav aria-label="Bereiche"><div class="wrap">
  <button data-tab="woche"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Woche</button>
  <button data-tab="einkauf"><svg viewBox="0 0 24 24"><path d="M3 4h2.5l2.2 11h10.6L20.5 8H7"/><circle cx="9.5" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg>Einkauf</button>
  <button data-tab="angebote"><svg viewBox="0 0 24 24"><path d="M3.5 12.5V4.5h8l9 9-8 8z"/><circle cx="8" cy="9" r="1.4"/></svg>Angebote</button>
  <button data-tab="profil"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20.5c1.2-4 4-5.8 7.5-5.8s6.3 1.8 7.5 5.8"/></svg>Profil</button>
</div></nav>

<script>
(() => {
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const eur = (n) => (Number(n) || 0).toLocaleString('de-DE', { style: 'currency', currency: 'EUR' });
  const gr = (n) => Math.round(Number(n) || 0).toLocaleString('de-DE') + ' g';
  const kc = (n) => Math.round(Number(n) || 0).toLocaleString('de-DE');
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} },
  };
  const WOCHENTAGE = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
  const KAT_REIHENFOLGE = ['Obst', 'Gemüse', 'Brot & Backwaren', 'Fleisch & Fisch', 'Milch & Käse', 'Eier', 'Nudeln, Reis & Getreide', 'Konserven & Saucen', 'Öl & Gewürze', 'Tiefkühl', 'Getränke', 'Snacks & Süßes', 'Sonstiges'];
  const THUMB = '<svg viewBox="0 0 24 24"><path d="M17 3.5v10M7.5 13.5l3 6.5c1.4 0 2.3-1 2.3-2.3v-3.2h4.8a2 2 0 0 0 2-2.3l-1.2-6.8a2 2 0 0 0-2-1.9H7.5z"/><path d="M7.5 3.5h-3v10h3"/></svg>';

  // GitHub-Repo aus der Adresse ableiten (deinname.github.io/wochenplan)
  const GH = (() => {
    const m = location.hostname.match(/^([^.]+)\.github\.io$/);
    const repo = location.pathname.split('/').filter(Boolean)[0];
    if (m && repo) return { owner: m[1], repo };
    const o = store.get('gh_repo', null); // nur für lokale Tests
    return o;
  })();
  const RAW = GH ? `https://raw.githubusercontent.com/${GH.owner}/${GH.repo}/main/` : '';
  const API = GH ? `https://api.github.com/repos/${GH.owner}/${GH.repo}` : '';

  let data = null;         // plan.json
  let saved = null;        // config.json wie im Repo
  let draft = null;        // config mit deinen ungespeicherten Änderungen
  let tab = store.get('tab', 'woche');
  let tag = null;
  let token = store.get('gh_token', '');
  let busy = '';           // Statusmeldung unten
  let poll = null;

  const clone = (o) => JSON.parse(JSON.stringify(o));
  const dirty = () => saved && draft && JSON.stringify(saved) !== JSON.stringify(draft);
  const lc = (s) => String(s).trim().toLowerCase();

  async function holeJson(datei) {
    const urls = [];
    if (RAW) urls.push(RAW + datei + '?t=' + Date.now());
    urls.push(datei + '?t=' + Date.now());
    for (const u of urls) {
      try { const r = await fetch(u, { cache: 'no-store' }); if (r.ok) return await r.json(); } catch {}
    }
    return null;
  }

  async function laden() {
    const [p, c] = await Promise.all([holeJson('plan.json'), holeJson('config.json')]);
    if (p) { data = p; store.set('cache', p); } else { data = store.get('cache', null); if (data) data._offline = true; }
    if (c) {
      saved = c;
      const d = store.get('draft', null);
      draft = d && d._basis === JSON.stringify(c) ? d.cfg : clone(c);
    }
  }

  function draftMerken() {
    if (dirty()) store.set('draft', { _basis: JSON.stringify(saved), cfg: draft });
    else store.del('draft');
  }

  // ---------- GitHub API
  async function gh(pfad, opts = {}) {
    const r = await fetch(API + pfad, {
      ...opts,
      headers: { Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + token, 'X-GitHub-Api-Version': '2022-11-28', ...(opts.body ? { 'Content-Type': 'application/json' } : {}) },
    });
    if (r.status === 401) throw new Error('Der GitHub-Schlüssel ist ungültig oder abgelaufen. Bitte im Profil neu verbinden.');
    if (r.status === 403 || r.status === 404) throw new Error('Dem GitHub-Schlüssel fehlen Rechte (Contents und Actions: Read and write).');
    if (!r.ok) throw new Error('GitHub-Fehler ' + r.status);
    return r.status === 204 ? null : r.json();
  }
  const b64 = (s) => btoa(unescape(encodeURIComponent(s)));

  async function speichern(neuPlanen) {
    if (!token) { tab = 'profil'; render(); return; }
    try {
      busy = 'Speichere Änderungen …'; render();
      const akt = await gh('/contents/config.json');
      const neu = clone(draft);
      await gh('/contents/config.json', { method: 'PUT', body: JSON.stringify({ message: 'Vorlieben aus der App geändert', content: b64(JSON.stringify(neu, null, 2) + '\n'), sha: akt.sha }) });
      saved = neu; draft = clone(neu); store.del('draft');
      if (neuPlanen) await planStarten();
      else { busy = ''; toast('Gespeichert – gilt ab dem nächsten Plan.'); }
    } catch (e) { busy = ''; toast(e.message, true); }
    render();
  }

  async function planStarten() {
    busy = 'Starte neue Planung …'; render();
    await gh('/actions/workflows/wochenplan.yml/dispatches', { method: 'POST', body: JSON.stringify({ ref: 'main' }) });
    store.set('lauf_seit', Date.now());
    beobachten();
  }

  function beobachten() {
    const seit = store.get('lauf_seit', 0);
    if (!seit || !token || Date.now() - seit > 40 * 60000) { store.del('lauf_seit'); return; }
    busy = 'Neuer Plan wird erstellt – dauert ca. 5–10 Minuten. Du kannst die App solange schließen.';
    render();
    clearTimeout(poll);
    poll = setTimeout(async () => {
      try {
        const r = await gh('/actions/workflows/wochenplan.yml/runs?per_page=1');
        const run = r.workflow_runs?.[0];
        if (run && new Date(run.created_at).getTime() > seit - 60000 && run.status === 'completed') {
          store.del('lauf_seit'); busy = '';
          await new Promise((res) => setTimeout(res, 8000)); // raw-Cache kurz abwarten
          await laden();
          toast(run.conclusion === 'success' ? 'Neuer Plan ist da!' : 'Planung fehlgeschlagen – Details unter Profil → GitHub Actions.', run.conclusion !== 'success');
          render();
          return;
        }
      } catch {}
      beobachten();
    }, 20000);
  }

  let toastMsg = null;
  function toast(text, bad) { toastMsg = { text, bad }; render(); setTimeout(() => { toastMsg = null; render(); }, 4500); }

  // ---------- Ansichten
  function kopf() {
    const sub = $('#sub');
    if (!data || !data.plan) sub.textContent = 'Noch kein Plan vorhanden';
    else {
      const von = data.prospekt?.von ? new Date(data.prospekt.von + 'T12:00:00') : null;
      const bis = von ? new Date(von.getTime() + 6 * 86400000) : null;
      const f = (d) => d.toLocaleDateString('de-DE', { day: 'numeric', month: 'short' });
      sub.textContent = (von ? `${f(von)} – ${f(bis)} · ` : '') + 'Lidl Lüneburg' + (data.personen > 1 ? ` · für ${data.personen}` : '');
    }
    const b = [];
    if (data?._offline) b.push(`<div class="banner warn">Offline – du siehst den zuletzt geladenen Plan.</div>`);
    if (data?.status === 'fehler') b.push(`<div class="banner bad"><b>Der letzte automatische Lauf hat nicht geklappt.</b><br>${esc(data.fehler)}${data.plan ? '<br><span class="muted">Unten siehst du weiterhin den letzten funktionierenden Plan.</span>' : ''}</div>`);
    $('#banners').innerHTML = b.join('');
  }

  const artikelMap = () => new Map((data.plan.artikel || []).map((a) => [a.id, a]));
  const magNicht = () => new Set((draft?.mag_nicht || []).map(lc));
  const gerichtNicht = () => new Set((draft?.mag_nicht_gerichte || []).map(lc));

  function makros(a, g) {
    const n = a?.naehrwerte_100g || {};
    const p = data.personen || 1;
    const f = (k) => ((Number(n[k]) || 0) * (Number(g) || 0)) / 100 / p;
    return { kcal: f('kcal'), protein: f('protein'), fett: f('fett'), kh: f('kh') };
  }

  function balken(label, wert, ziel, einheit) {
    const pct = ziel ? Math.min(100, (wert / ziel) * 100) : 0;
    const over = ziel && wert > ziel * 1.07;
    return `<div class="bar-row"><span>${label}</span><div class="bar"><i class="${over ? 'over' : ''}" style="width:${pct}%"></i></div><span class="num">${Math.round(wert)} / ${ziel ?? '–'} ${einheit}</span></div>`;
  }

  function woche() {
    const tage = data.plan.tage || [];
    if (!tage.length) return leer();
    const heute = WOCHENTAGE[new Date().getDay()];
    if (!tag || !tage.some((t) => t.tag === tag)) tag = tage.some((t) => t.tag === heute) ? heute : tage[0].tag;
    const t = tage.find((x) => x.tag === tag);
    const am = artikelMap();
    const p = data.personen || 1;
    const nope = magNicht(), nopeG = gerichtNicht();
    const ziele = data.ziele || {};
    const summe = { kcal: 0, protein: 0, fett: 0, kh: 0 };
    for (const e of data.feste_extras || []) for (const k in summe) summe[k] += Number(e[k]) || 0;

    let html = `<div class="days" role="group" aria-label="Tag wählen">` +
      tage.map((x) => `<button class="day" data-day="${esc(x.tag)}" aria-pressed="${x.tag === tag}">${esc(x.tag.slice(0, 2))}${x.tag === heute ? '<span class="today" aria-label="heute"></span>' : ''}</button>`).join('') + `</div>`;

    for (const m of data.mahlzeiten || [{ slot: 'mittag', label: 'Mittag' }, { slot: 'abend', label: 'Abend' }]) {
      const meal = t[m.slot];
      if (!meal) continue;
      const ms = { kcal: 0, protein: 0, fett: 0, kh: 0 };
      const zeilen = (meal.zutaten || []).map((z) => {
        const a = am.get(z.id);
        const mk = makros(a, z.g);
        for (const k in ms) ms[k] += mk[k];
        const name = a ? a.name : z.id;
        const aus = nope.has(lc(name));
        return `<li class="${aus ? 'nope' : ''}">
          <span class="iname">${esc(name)}<small>${kc(mk.kcal)} kcal · ${Math.round(mk.protein)} g P${p > 1 ? ' p. P.' : ''}</small></span>
          <span class="g"><b>${gr(Number(z.g) / p)}</b>${p > 1 ? `<br>${gr(z.g)} ges.` : ''}</span>
          <button class="nope-btn" data-nope="${esc(name)}" aria-pressed="${aus}" aria-label="${esc(name)} mag ich nicht">${THUMB}</button></li>`;
      }).join('');
      for (const k in summe) summe[k] += ms[k];
      const gAus = nopeG.has(lc(meal.name));
      html += `<section class="card">
        <div class="meal-head"><span class="slot">${esc(m.label)}${m.art ? ' · ' + esc(m.art) : ''}</span><span class="kcal-pill">${kc(ms.kcal)} kcal</span></div>
        <div class="meal-name ${gAus ? 'nope' : ''}">${esc(meal.name)}</div>
        <div class="macro-line">${Math.round(ms.protein)} g Protein · ${Math.round(ms.fett)} g Fett · ${Math.round(ms.kh)} g KH${p > 1 ? ' · pro Person' : ''}</div>
        ${meal.resteverwertung ? `<div class="reuse">↻ ${esc(meal.resteverwertung)}</div>` : ''}
        <ul class="ing">${zeilen}</ul>
        <div class="meal-actions">
          ${(meal.schritte || []).length ? `<details style="flex:1"><summary>Zubereitung</summary><ol class="steps">${meal.schritte.map((s) => `<li>${esc(s)}</li>`).join('')}</ol></details>` : '<span></span>'}
          <button class="link-btn" data-nope-gericht="${esc(meal.name)}" aria-pressed="${gAus}" style="align-self:flex-start">${gAus ? 'Gericht abgewählt' : '👎 Gericht nicht mögen'}</button>
        </div>
      </section>`;
    }

    html += `<section class="card"><div class="slot">${esc(tag)} · ${p > 1 ? 'pro Person' : 'gesamt'}</div>
      <div class="day-total"><span class="big">${kc(summe.kcal)}</span><span class="muted">von ${kc(ziele.kcal)} kcal</span></div>
      <div class="totals">
        ${balken('Protein', summe.protein, ziele.protein, 'g')}
        ${balken('Fett', summe.fett, ziele.fett, 'g')}
        ${balken('Kohlenh.', summe.kh, ziele.kh, 'g')}
      </div>${(data.feste_extras || []).length ? `<div class="extras">Inklusive ${data.feste_extras.map((e) => esc(e.name.replace(/\s*\(.*\)/, ''))).join(' und ')} (${kc(data.feste_extras.reduce((s, e) => s + (e.kcal || 0), 0))} kcal)</div>` : ''}</section>`;
    if (data.plan.zusammenfassung) html += `<h2>Die Idee dieser Woche</h2><div class="card" style="font-size:15px">${esc(data.plan.zusammenfassung)}</div>`;
    html += `<p class="muted" style="font-size:13px">Tippe auf 👎 bei Zutaten oder Gerichten, die du nicht magst – sie kommen dann nicht mehr in deine Pläne.</p>`;
    return html;
  }

  function einkauf() {
    const artikel = data.plan.artikel || [];
    if (!artikel.length) return leer();
    const key = 'haken:' + (data.erstellt || '');
    const haken = store.get(key, {});
    const gruppen = new Map();
    for (const a of artikel) {
      const k = a.kategorie || 'Sonstiges';
      if (!gruppen.has(k)) gruppen.set(k, []);
      gruppen.get(k).push(a);
    }
    const sortiert = [...gruppen.keys()].sort((a, b) => {
      const ia = KAT_REIHENFOLGE.indexOf(a), ib = KAT_REIHENFOLGE.indexOf(b);
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
    });
    const preis = (a) => (Number(a.preis_pro_packung) || 0) * (Number(a.anzahl) || 1);
    const summe = artikel.reduce((s, a) => s + preis(a), 0);
    const offen = artikel.filter((a) => !haken[a.id]).reduce((s, a) => s + preis(a), 0);
    const reste = data.auswertung?.reste || [];
    let html = `<section class="card"><div class="sum"><span class="muted">Geschätzt gesamt</span><span class="big">${eur(summe)}</span></div>
      <div class="sum" style="margin-top:2px"><span class="muted" style="font-size:14px">${artikel.length} Artikel · noch offen</span><span class="num">${eur(offen)}</span></div></section>`;
    html += reste.length ? `<div class="banner warn"><b>Hinweis zu Resten</b><br>${reste.map((r) => esc(`${r.name}: ${r.problem}`)).join('<br>')}</div>`
      : `<div class="banner info">Alles wird in der Woche aufgebraucht – keine Reste.</div>`;
    for (const k of sortiert) {
      html += `<h2>${esc(k)}</h2><section class="card" style="padding-top:6px;padding-bottom:6px"><ul class="shop">` +
        gruppen.get(k).map((a) => {
          const n = Number(a.anzahl) || 1;
          return `<li class="${haken[a.id] ? 'done' : ''}"><input type="checkbox" data-id="${esc(a.id)}" ${haken[a.id] ? 'checked' : ''} aria-label="${esc(a.name)} abhaken">
            <div class="what">${n > 1 ? `<b>${n}×</b> ` : ''}${esc(a.name)}${a.angebot ? '<span class="tag deal">Angebot</span>' : ''}
            <small>${gr(a.packung_g)} je Packung${a.naehrwerte_100g?.kcal != null ? ` · ${kc(a.naehrwerte_100g.kcal)} kcal/100 g` : ''}</small></div>
            <span class="price">${eur(preis(a))}</span></li>`;
        }).join('') + `</ul></section>`;
    }
    html += `<p class="muted" style="font-size:13px">Preise sind Prospektpreise bzw. geschätzte Normalpreise. Gewürze, Öl und Shakes sind als Vorrat nicht enthalten.</p>`;
    return html;
  }

  function angebote() {
    const list = data.angebote || [];
    if (!list.length) return `<div class="empty"><b>Keine Angebote gespeichert</b>Beim nächsten Lauf werden sie aus dem Prospekt gelesen.</div>`;
    const genutzt = (data.plan.artikel || []).filter((a) => a.angebot).map((a) => lc(a.name));
    const wort = (s) => lc(s).split(/[\s-]/)[0];
    const istGenutzt = (o) => genutzt.some((n) => lc(o.produkt).includes(wort(n)) || n.includes(wort(o.produkt)));
    let html = `<p class="muted" style="font-size:14px;margin:14px 0 0">${list.length} Lebensmittel-Angebote aus dem Prospekt. <a href="${esc(data.prospekt?.url || 'https://www.lidl.de/c/online-prospekte/s10005610')}" style="color:var(--accent)">Prospekt öffnen</a></p>`;
    html += `<section class="card" style="padding-top:6px;padding-bottom:6px">` + list.map((o) => `
      <div class="offer"><div class="what">${esc(o.produkt)}${istGenutzt(o) ? '<span class="tag used">im Plan</span>' : ''}
        <small>${esc([o.marke, o.menge, o.gueltig_ab ? 'ab ' + o.gueltig_ab : ''].filter(Boolean).join(' · '))}</small></div>
        <div class="price">${eur(o.preis)}${o.preis_mit_app ? `<small class="muted" style="display:block;text-align:right;font-size:12px">App ${eur(o.preis_mit_app)}</small>` : ''}</div></div>`).join('') + `</section>`;
    return html;
  }

  function chipListe(liste, feld, neuSet) {
    if (!liste.length) return `<span class="muted" style="font-size:14px">Noch nichts.</span>`;
    return `<div class="chips">${liste.map((x, i) => `<span class="chip ${neuSet.has(lc(x)) ? 'new' : ''}">${esc(x)}<button data-del="${feld}" data-i="${i}" aria-label="${esc(x)} entfernen">×</button></span>`).join('')}</div>`;
  }

  function profil() {
    if (!draft) return `<div class="empty"><b>Einstellungen nicht geladen</b>Prüfe deine Internetverbindung.</div>`;
    const z = draft.ziele || {};
    const altSet = (f) => new Set((saved[f] || []).map(lc));
    const neu = (f) => new Set((draft[f] || []).map(lc).filter((x) => !altSet(f).has(x)));
    let html = `<h2>Tagesziel pro Person</h2><section class="card"><div class="grid2">
      <label>Kalorien (kcal)<input class="field" type="number" inputmode="numeric" data-ziel="kcal" value="${esc(z.kcal)}"></label>
      <label>Protein (g)<input class="field" type="number" inputmode="numeric" data-ziel="protein" value="${esc(z.protein)}"></label>
      <label>Fett (g)<input class="field" type="number" inputmode="numeric" data-ziel="fett" value="${esc(z.fett)}"></label>
      <label>Kohlenhydrate (g)<input class="field" type="number" inputmode="numeric" data-ziel="kh" value="${esc(z.kh)}"></label>
      <label>Personen<input class="field" type="number" inputmode="numeric" min="1" max="6" data-feld="personen" value="${esc(draft.personen)}"></label>
      <label>Budget/Woche (€, leer = egal)<input class="field" type="number" inputmode="decimal" data-feld="budget_pro_woche_euro" value="${esc(draft.budget_pro_woche_euro ?? '')}"></label>
    </div>${(draft.feste_extras || []).length ? `<div class="extras">Fest eingeplant: ${draft.feste_extras.map((e) => esc(e.name) + ` (${e.kcal} kcal)`).join(', ')}</div>` : ''}</section>

    <h2>Mag ich nicht – Zutaten</h2><section class="card">
      ${chipListe(draft.mag_nicht || [], 'mag_nicht', neu('mag_nicht'))}
      <form class="add-row" data-add="mag_nicht"><input class="field" name="x" placeholder="z. B. Rosenkohl" autocomplete="off" enterkeyhint="done"><button class="btn">Hinzufügen</button></form>
    </section>

    <h2>Mag ich nicht – Gerichte</h2><section class="card">
      ${chipListe(draft.mag_nicht_gerichte || [], 'mag_nicht_gerichte', neu('mag_nicht_gerichte'))}
      <form class="add-row" data-add="mag_nicht_gerichte"><input class="field" name="x" placeholder="z. B. Linsen-Dal" autocomplete="off" enterkeyhint="done"><button class="btn">Hinzufügen</button></form>
    </section>`;

    html += `<h2>Planung</h2><section class="card" style="font-size:15px">
      Jeden Sonntag früh holt der Planer den neuen Lidl-Prospekt und baut daraus die Woche.
      ${data?.erstellt ? `<p class="muted" style="margin:8px 0 0;font-size:14px">Letzter Plan: ${new Date(data.erstellt).toLocaleString('de-DE', { weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' })} Uhr</p>` : ''}
      <div class="row">${token ? `<button class="btn accent" data-act="neu">Woche jetzt neu planen</button>` : ''}${GH ? `<a class="btn ghost" href="https://github.com/${GH.owner}/${GH.repo}/actions">GitHub Actions</a>` : ''}</div>
    </section>`;

    html += `<h2>Verbindung zu GitHub</h2><section class="card" style="font-size:15px">`;
    if (token) {
      html += `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><span>✓ Verbunden – Änderungen werden gespeichert.</span><button class="btn ghost" data-act="trennen">Trennen</button></div>`;
    } else {
      html += `Damit die App deine Änderungen speichern und neu planen kann, braucht sie einmalig einen GitHub-Schlüssel. Er bleibt nur auf diesem Handy.
      <ol class="how">
        <li>Öffne <a href="https://github.com/settings/personal-access-tokens/new" style="color:var(--accent)">github.com → Fine-grained token</a>.</li>
        <li>Name: „Wochenplan-App“, Ablauf: 1 Jahr.</li>
        <li>Repository access: <b>Only select repositories</b> → <b>${esc(GH?.repo || 'wochenplan')}</b>.</li>
        <li>Permissions → Repository: <b>Contents</b> und <b>Actions</b> auf „Read and write“.</li>
        <li>„Generate token“, kopieren und hier einfügen.</li>
      </ol>
      <form class="add-row" data-act="verbinden"><input class="field" name="t" placeholder="github_pat_…" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="btn">Verbinden</button></form>`;
    }
    html += `</section>`;
    return html;
  }

  function leer() {
    return `<div class="empty"><b>Noch kein Wochenplan</b>Der erste Plan erscheint nach dem ersten Lauf (sonntags) – oder sofort über Profil → „Woche jetzt neu planen“.</div>`;
  }

  function dock() {
    let h = '';
    if (toastMsg) h += `<div class="status" style="${toastMsg.bad ? 'background:var(--bad-soft);color:var(--bad)' : ''}">${esc(toastMsg.text)}</div>`;
    if (busy) h += `<div class="status"><span class="spin"></span><span>${esc(busy)}</span></div>`;
    else if (dirty()) {
      const n = ['mag_nicht', 'mag_nicht_gerichte'].reduce((s, f) => s + Math.abs((draft[f] || []).length - (saved[f] || []).length), 0);
      const text = n ? `${n} ${n === 1 ? 'Änderung' : 'Änderungen'} bei „Mag ich nicht“` : 'Einstellungen geändert';
      h += token
        ? `<div class="savebar"><span class="t">${text}</span><button class="btn" data-act="save">Speichern</button><button class="btn accent" data-act="savenew">+ neu planen</button></div>`
        : `<div class="savebar"><span class="t">${text} – noch nicht gespeichert</span><button class="btn" data-act="zumprofil">Verbinden</button></div>`;
    }
    $('#dock').innerHTML = h;
  }

  function render() {
    kopf();
    document.querySelectorAll('nav button').forEach((b) => b.setAttribute('aria-current', b.dataset.tab === tab ? 'page' : 'false'));
    const v = $('#view');
    if (tab === 'profil') v.innerHTML = profil();
    else if (!data) v.innerHTML = `<div class="empty"><b>Keine Verbindung</b>Der Plan konnte nicht geladen werden.</div>`;
    else if (!data.plan) v.innerHTML = leer();
    else v.innerHTML = { woche, einkauf, angebote }[tab]();
    dock();
  }

  function toggle(feld, wert) {
    if (!draft) return;
    const liste = draft[feld] || (draft[feld] = []);
    const i = liste.findIndex((x) => lc(x) === lc(wert));
    if (i >= 0) liste.splice(i, 1); else liste.push(wert);
    draftMerken(); render();
  }

  document.addEventListener('click', async (e) => {
    const t = e.target;
    const nb = t.closest('nav button');
    if (nb) { tab = nb.dataset.tab; store.set('tab', tab); render(); scrollTo(0, 0); return; }
    const d = t.closest('.day'); if (d) { tag = d.dataset.day; render(); return; }
    const n = t.closest('[data-nope]'); if (n) { toggle('mag_nicht', n.dataset.nope); return; }
    const ng = t.closest('[data-nope-gericht]'); if (ng) { toggle('mag_nicht_gerichte', ng.dataset.nopeGericht); return; }
    const del = t.closest('[data-del]');
    if (del) { draft[del.dataset.del].splice(+del.dataset.i, 1); draftMerken(); render(); return; }
    const act = t.closest('button[data-act]')?.dataset.act;
    if (act === 'save') speichern(false);
    if (act === 'savenew') speichern(true);
    if (act === 'zumprofil') { tab = 'profil'; store.set('tab', tab); render(); scrollTo(0, document.body.scrollHeight); }
    if (act === 'trennen') { token = ''; store.del('gh_token'); render(); }
    if (act === 'neu') { try { dirty() ? await speichern(true) : await planStarten(); } catch (err) { busy = ''; toast(err.message, true); } }
  });

  document.addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = e.target;
    if (f.dataset.add) {
      const v = f.x.value.trim();
      if (v && !(draft[f.dataset.add] || []).some((x) => lc(x) === lc(v))) { (draft[f.dataset.add] ||= []).push(v); draftMerken(); }
      render();
      $(`form[data-add="${f.dataset.add}"] input`)?.focus();
    }
    if (f.dataset.act === 'verbinden') {
      const v = f.t.value.trim();
      if (!v) return;
      token = v;
      try { await gh(''); store.set('gh_token', v); toast('Verbunden!'); }
      catch (err) { token = ''; toast(err.message, true); }
      render();
    }
  });

  document.addEventListener('change', (e) => {
    const cb = e.target.closest('.shop input');
    if (cb) {
      const key = 'haken:' + (data.erstellt || '');
      const h = store.get(key, {});
      if (cb.checked) h[cb.dataset.id] = 1; else delete h[cb.dataset.id];
      store.set(key, h); render(); return;
    }
    const zf = e.target.closest('[data-ziel]');
    if (zf) { draft.ziele[zf.dataset.ziel] = Number(zf.value) || 0; draftMerken(); dock(); return; }
    const ff = e.target.closest('[data-feld]');
    if (ff) { draft[ff.dataset.feld] = ff.value === '' ? null : Number(ff.value); draftMerken(); dock(); }
  });

  document.addEventListener('visibilitychange', () => { if (!document.hidden && !busy) laden().then(render); });

  render();
  laden().then(() => { render(); beobachten(); });
})();
</script>
</body>
</html>
