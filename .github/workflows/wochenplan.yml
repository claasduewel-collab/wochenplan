name: Wochenplan

on:
  schedule:
    - cron: '17 5 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prospekt lesen und Woche planen
        run: node update.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Plan speichern
        run: |
          git config user.name "wochenplan-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plan.json
          git diff --cached --quiet || git commit -m "Wochenplan aktualisiert"
          git push

